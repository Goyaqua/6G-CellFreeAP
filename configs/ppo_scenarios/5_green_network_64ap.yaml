# 🌱 SCENARIO 5: GREEN NETWORK - Energy Efficiency Priority
# 64 APs, 16 Users, Power-Dominant 3x Rewards
#
# Scientific Goal: Demonstrate green networking with minimal viable QoS
# Expected: ~10-15 active APs (minimal APs), ~30-50 Mbps/user, maximum EE
#
# Reward Balance: rate×0.008 ≈ 0.32 points | power×35.0 ≈ 17.5 points | Ratio 0.32:17.5 (Ultra Green!) ✅

network:
  num_aps: 64                      # Many APs to shut down
  num_users: 16                    # Standard load
  num_antennas_per_ap: 1
  area_size: 500.0
  carrier_frequency: 3.5e9
  bandwidth: 10e6
  max_power_per_ap: 0.2
  noise_power_dbm: -94
  circuit_power_per_ap: 0.2

environment:
  qos_min_rate_mbps: 5.0

  # 🌱 ULTRA GREEN MODE (10-15 APs for 16 users)
  rate_weight: 0.008               # log_sum_rate (40) × 0.008 = 0.32 points
  power_penalty_weight: 35.0       # normalized_power (0.5) × 35.0 = 17.5 points (Ratio 0.32:17.5)
  qos_weight: 3.0                  # Minimum viable QoS (relaxed)
  fairness_weight: 0.0             # Energy over fairness

  episode_length: 50
  action_type: 'discrete'
  num_power_levels: 5
  randomize_circuit_power: true
  circuit_power_range: [0.1, 0.5]

training:
  total_timesteps: 200000
  eval_freq: 10000
  save_freq: 20000
  n_eval_episodes: 5

  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05
    vf_coef: 0.5
    max_grad_norm: 0.5

evaluation:
  n_episodes: 100
  baseline_strategies:
    - 'nearest_max'
    - 'equal_all'
    - 'load_balance'
    - 'wmmse'

output:
  results_dir: './results'
  logs_dir: './logs'
  plots_dir: './plots'
  tensorboard_log: './tensorboard'
  save_models: true
  save_plots: true
  verbose: 1

seed:
  env_seed: 42
  agent_seed: 42
  eval_seed: 123
