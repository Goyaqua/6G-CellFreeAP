# 📶 SCENARIO 3: HIGH DENSITY - Interference Management & Fairness
# 64 APs, 32 Users, Rate-Dominant with Fairness
#
# Scientific Goal: Test interference management and fair allocation under congestion
# Expected: ~40-48 active APs (1.25-1.5x AP/user), ~20-40 Mbps/user, minimal QoS violations
#
# Reward Balance: rate×0.03 ≈ 3.3 points | power×4.0 ≈ 2.0 points | Ratio 1.6:1 (rate-dominant + fairness) ✅

network:
  num_aps: 64                      # All APs may be needed
  num_users: 32                    # High user density (congested)
  num_antennas_per_ap: 1
  area_size: 500.0
  carrier_frequency: 3.5e9
  bandwidth: 10e6
  max_power_per_ap: 0.2
  noise_power_dbm: -94
  circuit_power_per_ap: 1.0        # 1W circuit power (realistic idle consumption)

environment:
  qos_min_rate_mbps: 5.0

  # 📶 RATE-DOMINANT WITH FAIRNESS (1.6:1 ratio - rate leads, fairness guards)
  rate_weight: 0.03                # log_sum_rate (~110) × 0.03 ≈ 3.3 points
  power_penalty_weight: 4.0        # normalized_power (~0.5) × 4.0 ≈ 2.0 points (Ratio 1.6:1)
  qos_weight: 3.0                  # Moderate QoS (scaled down for 32 users)
  fairness_weight: 3.0             # Fairness important but not overwhelming

  episode_length: 50
  action_type: 'discrete'
  num_power_levels: 5
  randomize_circuit_power: true
  circuit_power_range: [0.5, 2.0]  # 500mW-2W range (realistic)

training:
  total_timesteps: 250000          # Extra timesteps for complex scenario
  eval_freq: 10000
  save_freq: 25000
  n_eval_episodes: 5

  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05
    vf_coef: 0.5
    max_grad_norm: 0.5

evaluation:
  n_episodes: 100
  baseline_strategies:
    - 'nearest_max'
    - 'equal_all'
    - 'load_balance'
    - 'wmmse'

output:
  results_dir: './results'
  logs_dir: './logs'
  plots_dir: './plots'
  tensorboard_log: './tensorboard'
  save_models: true
  save_plots: true
  verbose: 1

seed:
  env_seed: 42
  agent_seed: 42
  eval_seed: 123
