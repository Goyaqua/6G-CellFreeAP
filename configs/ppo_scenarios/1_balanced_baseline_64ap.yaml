# 🎯 SCENARIO 1: BALANCED BASELINE - Primary Thesis Result
# 64 APs, 16 Users, Mathematically Balanced Rewards
#
# Scientific Goal: Demonstrate balanced RL approach for cell-free networks
# Expected: ~20-25 active APs, ~50-80 Mbps avg rate, high energy efficiency
#
# Reward Balance: rate×0.03 ≈ 1.2 points | power×15.0 ≈ 7.5 points | Ratio 1.2:7.5 ✅ (Power Wins!)

network:
  num_aps: 64                      # Fixed: All scenarios use 64 APs
  num_users: 16                    # Balanced load
  num_antennas_per_ap: 1
  area_size: 500.0
  carrier_frequency: 3.5e9
  bandwidth: 10e6
  max_power_per_ap: 0.2            # 200mW max transmit power
  noise_power_dbm: -94
  circuit_power_per_ap: 0.2        # 200mW circuit power

environment:
  qos_min_rate_mbps: 5.0

  # ⚖️ MATHEMATICALLY BALANCED WEIGHTS (Power Dominant for 20-25 APs)
  rate_weight: 0.03                # log_sum_rate (40) × 0.03 = 1.2 points
  power_penalty_weight: 15.0       # normalized_power (0.5) × 15.0 = 7.5 points (Ratio 1.2:7.5)
  qos_weight: 5.0                  # QoS penalty (Mbps violations) × 5.0
  fairness_weight: 0.0             # No fairness constraint (16 users)

  episode_length: 50
  action_type: 'discrete'
  num_power_levels: 5
  randomize_circuit_power: true    # Adaptive circuit power
  circuit_power_range: [0.1, 0.5]  # 100mW-500mW range

training:
  total_timesteps: 200000          # Increased for 64 APs (large action space)
  eval_freq: 10000
  save_freq: 20000
  n_eval_episodes: 5

  # PPO Configuration
  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256                # Stable gradients
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05                 # Exploration for large action space
    vf_coef: 0.5
    max_grad_norm: 0.5

evaluation:
  n_episodes: 100
  baseline_strategies:
    - 'nearest_max'
    - 'equal_all'
    - 'load_balance'
    - 'wmmse'

output:
  results_dir: './results'
  logs_dir: './logs'
  plots_dir: './plots'
  tensorboard_log: './tensorboard'
  save_models: true
  save_plots: true
  verbose: 1

seed:
  env_seed: 42
  agent_seed: 42
  eval_seed: 123
