# 🔋 SCENARIO 2: LOW DENSITY - AP Shutdown Capability Test
# 64 APs, 8 Users, Power-Dominant Rewards
#
# Scientific Goal: Validate agent learns to shut down unnecessary APs
# Expected: ~12-16 active APs (1.5-2x AP/user), ~60-100 Mbps/user, very high EE
#
# Reward Balance: rate×0.05 ≈ 1.65 points | power×5.0 ≈ 2.5 points | Ratio 1:1.5 (mild power-dominant) ✅

network:
  num_aps: 64                      # Over-provisioned (64 APs for 8 users)
  num_users: 8                     # Low user density
  num_antennas_per_ap: 1
  area_size: 500.0
  carrier_frequency: 3.5e9
  bandwidth: 10e6
  max_power_per_ap: 0.2
  noise_power_dbm: -94
  circuit_power_per_ap: 1.0        # 1W circuit power (realistic idle consumption)

environment:
  qos_min_rate_mbps: 5.0

  # 🔋 POWER SAVING (1:1.5 ratio - mild power saving, still rate-competitive)
  rate_weight: 0.05                # log_sum_rate (~33) × 0.05 ≈ 1.65 points
  power_penalty_weight: 5.0        # normalized_power (~0.5) × 5.0 ≈ 2.5 points (Ratio 1:1.5)
  qos_weight: 3.0                  # Relaxed QoS (8 users = less congestion)
  fairness_weight: 0.0             # No fairness needed (few users)

  episode_length: 50
  action_type: 'discrete'
  num_power_levels: 5
  randomize_circuit_power: true
  circuit_power_range: [0.5, 2.0]  # 500mW-2W range (realistic)

training:
  total_timesteps: 200000
  eval_freq: 10000
  save_freq: 20000
  n_eval_episodes: 5

  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05
    vf_coef: 0.5
    max_grad_norm: 0.5

evaluation:
  n_episodes: 100
  baseline_strategies:
    - 'nearest_max'
    - 'equal_all'
    - 'load_balance'
    - 'wmmse'

output:
  results_dir: './results'
  logs_dir: './logs'
  plots_dir: './plots'
  tensorboard_log: './tensorboard'
  save_models: true
  save_plots: true
  verbose: 1

seed:
  env_seed: 42
  agent_seed: 42
  eval_seed: 123
