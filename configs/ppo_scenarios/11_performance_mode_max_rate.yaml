# Scenario 11: Performance Mode - Maximum Throughput
# 36 APs, 10 Users - Same as Scenario 1 but with rate bonus
# Scientific Goal: Test how rate bonus affects agent behavior
# Hypothesis: Agent should prioritize rate maximization over energy saving
# Expected: Higher rates, higher power, lower EE but better user experience

network:
  num_aps: 36                      # Same as Scenario 1
  num_users: 10                    # Same as Scenario 1
  num_antennas_per_ap: 1
  area_size: 500.0
  carrier_frequency: 3.5e9
  bandwidth: 10e6
  max_power_per_ap: 0.2
  noise_power_dbm: -94
  circuit_power_per_ap: 0.2

environment:
  qos_min_rate_mbps: 5.0           # Standard QoS (must satisfy)
  qos_weight: 2.0                  # Standard QoS penalty
  rate_weight: 1.5                 # PERFORMANCE MODE: Throughput maximization
  power_penalty_weight: 0.3        # Power less critical
  fairness_weight: 0.0             # No fairness penalty needed
  episode_length: 50
  action_type: 'discrete'
  num_power_levels: 5
  randomize_circuit_power: true
  circuit_power_range: [0.1, 0.5]

training:
  total_timesteps: 200000
  eval_freq: 10000
  save_freq: 25000
  n_eval_episodes: 5

  # PPO Configuration
  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5

evaluation:
  n_episodes: 50
  baseline_strategies:
    - 'nearest_max'
    - 'equal_all'
    - 'load_balance'
    - 'wmmse'

output:
  results_dir: './results'
  logs_dir: './logs'
  plots_dir: './plots'
  tensorboard_log: './tensorboard'
  save_models: true
  save_plots: true
  verbose: 1

seed:
  env_seed: 42
  agent_seed: 42
  eval_seed: 2024

# Expected Agent Behavior (compared to Scenario 1):
# - Scenario 1 (rate_bonus=0.0): ~10 active APs, 35 Mbps rate, high EE
# - Scenario 11 (rate_bonus=0.2): ~20-25 active APs, 60-80 Mbps rate, lower EE
#
# Reward Formula:
# reward = log10(EE) + rate_bonus_weight × avg_rate - qos_penalty - power_penalty
#        = ~7.5      + 0.2 × 60                    - 0              - 1.5
#        = 7.5       + 12.0                        - 0              - 1.5
#        = 18.0
#
# Comparison:
# Normal Mode:      log_ee (~7.5) + 0        - 0 - 0.5 = 7.0
# Performance Mode: log_ee (~7.0) + 12.0     - 0 - 1.5 = 17.5
#
# Agent learns: "High throughput is rewarded! Use more APs, max power"
#
# Key Insight:
# "Performance Mode = Pay 0.2 reward points for each extra Mbps"
# Agent adapts by activating many APs + high power → maximize user experience
#
# Trade-off:
# - Energy Efficiency: Decreases (more power consumed)
# - User Satisfaction: Increases (much higher rates)
# - Active APs: Increases (2-3× more than normal mode)
#
# Use Case: Stadium/Conference scenario where user experience > energy cost
