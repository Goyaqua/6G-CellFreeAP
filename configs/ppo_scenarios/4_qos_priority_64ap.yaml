# 🚀 SCENARIO 4: QoS PRIORITY - Maximum Performance Upper Bound
# 64 APs, 16 Users, Rate-Overwhelming Rewards
#
# Scientific Goal: Demonstrate maximum achievable rate when energy is secondary
# Expected: ~48-56 active APs (3-3.5x AP/user), ~80-120 Mbps/user, low EE
#
# Reward Balance: rate×0.06 ≈ 3.8 points | power×3.0 ≈ 1.5 points | Ratio 2.5:1 (rate-dominant) ✅

network:
  num_aps: 64                      # All APs available for max performance
  num_users: 16                    # Standard load
  num_antennas_per_ap: 1
  area_size: 500.0
  carrier_frequency: 3.5e9
  bandwidth: 10e6
  max_power_per_ap: 0.2
  noise_power_dbm: -94
  circuit_power_per_ap: 1.0        # 1W circuit power (realistic idle consumption)

environment:
  qos_min_rate_mbps: 5.0

  # 🚀 RATE-DOMINANT (2.5:1 ratio - rate wins, power still considered)
  rate_weight: 0.06                # log_sum_rate (~63) × 0.06 ≈ 3.8 points
  power_penalty_weight: 3.0        # normalized_power (~0.5) × 3.0 ≈ 1.5 points (Ratio 2.5:1)
  qos_weight: 5.0                  # Strong QoS (but not training-destabilizing)
  fairness_weight: 0.0             # Performance over fairness

  episode_length: 50
  action_type: 'discrete'
  num_power_levels: 5
  randomize_circuit_power: true
  circuit_power_range: [0.5, 2.0]  # 500mW-2W range (realistic)

training:
  total_timesteps: 200000
  eval_freq: 10000
  save_freq: 20000
  n_eval_episodes: 5

  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05
    vf_coef: 0.5
    max_grad_norm: 0.5

evaluation:
  n_episodes: 100
  baseline_strategies:
    - 'nearest_max'
    - 'equal_all'
    - 'load_balance'
    - 'wmmse'

output:
  results_dir: './results'
  logs_dir: './logs'
  plots_dir: './plots'
  tensorboard_log: './tensorboard'
  save_models: true
  save_plots: true
  verbose: 1

seed:
  env_seed: 42
  agent_seed: 42
  eval_seed: 123
